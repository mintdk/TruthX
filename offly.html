<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TruthX Offline</title>

<link rel="stylesheet" href="offly.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<div class="container">

  <h1 class="title">
    <span class="truth">Truth</span><span class="x">X</span>
  </h1>

  <div id="setup">
    <p>Add Players</p>
    <input id="playerInput" placeholder="Player name">
    <button onclick="addPlayer()">Add</button>
    <button onclick="startGame()">Start Game</button>

    <div id="playerList"></div>
  </div>

  <div id="game" class="hidden">
    <div id="roulette"></div>

    <div id="choice" class="hidden">
      <div class="player-name" id="activePlayer"></div>
      <button class="truth-btn" onclick="showTruth()">Truth</button>
      <button class="dare-btn" onclick="showDare()">Dare</button>
    </div>

    <div id="challengeBox" class="hidden">
      <div class="challenge" id="challengeText"></div>
      <button class="complete-btn" onclick="complete()">Complete</button>
      <button class="giveup-btn" onclick="retire()">Give Up</button>
    </div>
  </div>

</div>

<script src="offly.data.js"></script>
<script src="offly.js"></script>

</body>
</html>
