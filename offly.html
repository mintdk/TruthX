<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TruthX Offline</title>

  <link rel="stylesheet" href="offly.css">
</head>

<body>

<main class="container">

  <h1 class="title">
    <span class="truth">Truth</span><span class="x">X</span>
  </h1>

  <section id="addPlayers">
    <p class="subtitle">Add players</p>
    <input id="nameInput" type="text" placeholder="Player name">
    <button class="primary" onclick="addPlayer()">Add</button>
    <button onclick="startGame()">Start Game</button>
  </section>

  <section id="playersSection" class="hidden">
    <div id="playersGrid" class="players-grid"></div>
    <button class="primary" onclick="spin()">Play</button>
  </section>

  <section id="choiceSection" class="hidden">
    <h2 id="currentPlayer" class="player-name"></h2>
    <div class="actions">
      <button class="truth" onclick="chooseTruth()">Truth</button>
      <button class="dare" onclick="chooseDare()">Dare</button>
    </div>
  </section>

  <section id="challengeSection" class="hidden">
    <h2 id="challengePlayer" class="player-name"></h2>
    <p id="challengeText" class="challenge"></p>
    <div class="actions">
      <button class="complete" onclick="completeTurn()">Done</button>
      <button class="retire" onclick="retirePlayer()">Give up</button>
    </div>
  </section>

</main>

<script src="offly.js"></script>
</body>
</html>
